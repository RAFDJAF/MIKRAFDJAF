name: Fabriquer MIKRAFDJAF

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Décompresser le projet
        run: unzip -o -q MIKRAFDJAF-projet.zip -d .

      - name: Télécharger Mikhmon et PHP
        run: bash scripts/prepare.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Fabriquer l'APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk MIKRAFDJAF.apk

      - name: Publier l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: MIKRAFDJAF v1.0.${{ github.run_number }}
          files: MIKRAFDJAF.apk
